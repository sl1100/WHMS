spring.application.name=cms
server.port=8086

### Kafka configuration
spring.kafka.consumer.group-id=cms
spring.kafka.client-id=cms

### Kafka topics
com.bttls.cms.kafka.sensor.services=whs1,whs2
com.bttls.cms.kafka.sensor.alarm.topic-suffix=sensor.alarm.threshold
com.bttls.cms.kafka.sensor.monitor.temperature.topic=sensor.monitor.temperature
com.bttls.cms.kafka.sensor.monitor.humidity.topic=sensor.monitor.humidity
